# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/

# ------ 1. 全局配置 ------
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# 加载动态模块
include /usr/share/nginx/modules/*.conf;

# ------ 2. Events 模块 ------
events {
    worker_connections 1024;
}

# ------ 3. HTTP 模块 ------
http {
    # ------ 3.1. 基础 HTTP 设置 ------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 512M;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;


    # ------ 3.2. Gzip 压缩配置 ------
     gzip on;
     gzip_vary on;
     gzip_proxied any;
     gzip_comp_level 6;
     gzip_buffers 16 8k;
     gzip_http_version 1.1;
     gzip_min_length 256;
     gzip_types
         application/atom+xml application/javascript application/json application/ld+json
         application/manifest+json application/rss+xml application/vnd.geo+json
         application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json
         application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml
         image/x-icon text/cache-manifest text/css text/plain text/vcard
         text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;


    # ------ 3.3. HTTP 重定向到 HTTPS Server ------
    server {
        listen       80;
        listen       [::]:80;
        server_name  ppmc.club www.ppmc.club;

        # 将所有 HTTP 请求永久重定向到 HTTPS，并保留请求路径
        return 301 https://$host$request_uri;
    }


    # ------ 3.4. 主 HTTPS Server ------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ppmc.club www.ppmc.club;

        # --- SSL 证书和安全增强配置 ---
        ssl_certificate         /etc/nginx/ssl/ppmc.club_bundle.crt;
        ssl_certificate_key     /etc/nginx/ssl/ppmc.club.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # =====================================================================
        # --- 静态资源 & 单页应用 (SPA) 服务 ---
        # =====================================================================

        # [修改] 1. 优先处理地图图片的静态文件请求
        # 此 location 块必须放在 `/webchat-vue/` 块的前面
        location /webchat-vue/map-images/ {
            # [修改] 2. `alias` 指令修正为指向目录
            alias /home/container/springboot/8080/uploads/map-images/;

            expires 30d;
            add_header Cache-Control "public";
            sendfile on;
            autoindex off;
        }

        # [修改] 3. 为 /webchat-vue/ 创建独立的 location 块
        # 用于正确处理 Vue 应用的静态资源和前端路由
        location /webchat-vue/ {
            # 请确认您的 Vue 项目构建后的 `dist` 目录的 **父目录**
            # 例如, 如果项目在 /var/www/webchat-vue/dist, root 应是 /var/www/webchat-vue
            # 这里根据您之前的配置，假设它在 /usr/share/nginx/html/webchat-vue
            root /usr/share/nginx/html;
            try_files $uri $uri/ /webchat-vue/index.html;
        }

        # [修改] 4. 从正则表达式中移除 webchat-vue，因为它已有独立配置
        location ~ ^/(blog|navhub|mediahub|game|codehub|player)/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /$1/index.html;
        }

        # 根路径的静态资源或单页应用
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # =====================================================================
        # --- 反向代理服务 ---
        # =====================================================================

        # 代理到后端服务 /demo/
        location /demo/ {
            proxy_pass http://10.1.8.7:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /workflow/
        location /workflow/ {
            proxy_pass http://10.1.8.7:8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /webrtc/
        location /webrtc/ {
            proxy_pass http://10.1.8.7:8084/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /idea/
        location /idea/ {
            proxy_pass http://10.1.8.7:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /webchat/ (您的 Spring Boot 应用)
        location /webchat/ {
            proxy_pass http://10.1.8.7:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # =====================================================================
        # --- 错误页面处理 ---
        # =====================================================================
        error_page 404 /404.html;
        location = /404.html {
           root   /usr/share/nginx/html/blog/error;
           internal;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
           root   /usr/share/nginx/html/blog/error;
           internal;
        }
    }

    # 如果您使用 /etc/nginx/conf.d/ 目录来组织配置，可以保留此行
    # include /etc/nginx/conf.d/*.conf;
}