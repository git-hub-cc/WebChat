# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/

# ------ 1. 全局配置 ------
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn; # 建议将日志级别设为 warn，减少不必要的日志
pid /run/nginx.pid;

# 加载动态模块
include /usr/share/nginx/modules/*.conf;

# ------ 2. Events 模块 ------
events {
    worker_connections 1024;
}

# ------ 3. HTTP 模块 ------
http {
    # ------ 3.1. 基础 HTTP 设置 ------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 512M; # 提升到 http 级别，对所有 server 生效

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;


    # ------ 3.2. Gzip 压缩配置 ------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml application/javascript application/json application/ld+json
        application/manifest+json application/rss+xml application/vnd.geo+json
        application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json
        application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml
        image/x-icon text/cache-manifest text/css text/plain text/vcard
        text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;


    # ------ 3.3. HTTP 重定向到 HTTPS Server ------
    server {
        listen       80;
        listen       [::]:80;
        server_name  ppmc.club www.ppmc.club;

        # 将所有 HTTP 请求永久重定向到 HTTPS，并保留请求路径
        return 301 https://$host$request_uri;
    }


    # ------ 3.4. 主 HTTPS Server ------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ppmc.club www.ppmc.club;

        # 定义静态文件的根目录，所有 location 块将继承此设置
        root /usr/share/nginx/html;

        # --- SSL 证书和安全增强配置 ---
        # 强烈建议使用绝对路径存放证书
        ssl_certificate         /etc/nginx/ssl/ppmc.club_bundle.crt;
        ssl_certificate_key     /etc/nginx/ssl/ppmc.club.key;

        # 推荐的 TLS/SSL 安全配置
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # HSTS (HTTP Strict Transport Security) 头，强制浏览器使用 HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


        # --- 静态资源服务 (优化合并) ---
        # 使用正则表达式合并多个提供单页应用(SPA)的 location
        # 对于 /blog/, /webchat-vue/, /navhub/ 等路径...
        location ~ ^/(blog|webchat-vue|navhub|mediahub|game|codehub|player)/ {
            # try_files 会按顺序查找文件:
            # 1. $uri: 精确的文件 (e.g., /blog/assets/style.css)
            # 2. $uri/: 目录 (e.g., /blog/assets/)
            # 3. /$1/index.html: 如果都找不到，则返回该应用的入口 index.html (支持前端路由)
            #    $1 会捕获括号中的内容，如 "blog" 或 "webchat-vue"
            try_files $uri $uri/ /$1/index.html;
        }

        # 根路径的静态资源或单页应用
        location / {
            # 如果是单页应用，此配置可确保刷新页面时不会 404
            try_files $uri $uri/ /index.html;
        }


        # --- 反向代理服务 ---
        # 代理到后端服务 /demo/
        location /demo/ {
            proxy_pass http://10.1.8.7:8081/;

            # --- 通用代理头部设置 ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- WebSocket 支持 ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # --- 代理超时设置 ---
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /workflow/
        location /workflow/ {
            proxy_pass http://10.1.8.7:8083/;

            # --- 通用代理头部设置 ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- WebSocket 支持 ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # --- 代理超时设置 ---
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /webrtc/
        location /webrtc/ {
            proxy_pass http://10.1.8.7:8084/;

            # --- 通用代理头部设置 ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- WebSocket 支持 ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # --- 代理超时设置 ---
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /idea/
        location /idea/ {
            proxy_pass http://10.1.8.7:8082/;

            # --- 通用代理头部设置 ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- WebSocket 支持 ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # --- 代理超时设置 ---
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 代理到后端服务 /webchat/
        location /webchat/ {
            proxy_pass http://10.1.8.7:8080/;

            # --- 通用代理头部设置 ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- WebSocket 支持 ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # --- 代理超时设置 ---
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }


        # --- 错误页面处理 ---
        error_page 404 /404.html;
        location = /404.html {
           root   /usr/share/nginx/html/blog/error;
           internal; # 标记为内部请求，防止用户直接访问
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
           root   /usr/share/nginx/html/blog/error;
           internal; # 标记为内部请求
        }
    }

    # 如果你使用 /etc/nginx/conf.d/ 目录，可以保留此行
    # include /etc/nginx/conf.d/*.conf;
}