# 服务器配置
server:
  port: 8080
  # [新增] 服务器GUID持久化文件路径
  guid:
    path: data/server.guid

# Spring 应用配置
spring:
  application:
    name: Web-Chat
  jackson:
    time-zone: Asia/Shanghai

  # ===============================================
  # [新增] H2 内存数据库配置 (用于开发和演示)
  # 生产环境请替换为 MySQL, PostgreSQL 等
  # ===============================================
  datasource:
    url: jdbc:h2:file:./data/webchatdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # 自动更新表结构
    show-sql: false # 设为 true 可在控制台查看执行的SQL语句


# 日志配置
logging:
  level:
    club.ppmc: DEBUG # 应用主包的日志级别，设为DEBUG以获取详细日志
    org.springframework.web.socket: INFO # WebSocket交互日志级别设为INFO，避免刷屏
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 自定义WebSocket服务器设置
websocket:
  max:
    # 消息缓冲区大小（单位：KB）
    text-buffer-size-kb: 1024
    binary-buffer-size-kb: 1024
    # 会话空闲超时时间（单位：分钟）
    session-timeout-min: 5

# 自定义API配置
api:
  v1:
    request:
      # v1 API的每日请求限制（每个客户端IP）
      limit: 400

# CORS 和 WebSocket 允许的源列表
allowed:
  origins:
    - "https://ppmc.club"
    - "https://www.ppmc.club"
    - "https://git-hub-cc.github.io"
    - "http://localhost:8080"
    - "http://localhost:3000"
    - "http://localhost:5173"

